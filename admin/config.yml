backend:
  name: github
  repo: lighthuntersdev/asw-suedwest
  branch: main

media_folder: "images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog-Beiträge"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Kategorie", name: "category", widget: "select", options: ["Versicherung", "Cyberrisiken", "Gebäudeschutz", "D&O", "Haftpflicht", "Wohnungswirtschaft", "Finanzierung", "Recht"] }
      - { label: "Lesezeit", name: "readtime", widget: "string", default: "5 Min. Lesezeit" }
      - { label: "Kurzbeschreibung", name: "description", widget: "text" }
      - { label: "Beitragsbild", name: "image", widget: "image", required: false }
      - { label: "Beitragsbild Alt-Text", name: "image_alt", widget: "string", required: false }
      - { label: "Inhalt", name: "body", widget: "markdown" }
