  badge: "Betriebliche Vorsorge"
  title: "Benefits für die Wohnungswirtschaft"
  subtitle: "In der Wohnungswirtschaft wird langfristiges Denken großgeschrieben -- und genau diese Haltung ist auch bei der Altersvorsorge gefragt."
  cta_primary:
