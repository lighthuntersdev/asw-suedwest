faq:
  tag: "Häufige Fragen"
  title: "Antworten auf Ihre Fragen"
  subtitle: "Die wichtigsten Informationen zu unseren Leistungen und zur Zusammenarbeit."
  items:
    - question: "Welche Versicherungen sind für Wohnungsunternehmen Pflicht?"
      answer: "Für Wohnungsunternehmen sind insbesondere die Gebäudeversicherung (Feuer, Leitungswasser, Sturm/Hagel), die Haus- und Grundbesitzerhaftpflicht sowie je nach Rechtsform eine D&O-Versicherung essenziell. Wir analysieren Ihren individuellen Bedarf und empfehlen die optimale Absicherung."
    - question: "Was deckt eine Vermögensschadenhaftpflicht ab?"
      answer: "Die Vermögensschadenhaftpflicht schützt Ihr Unternehmen vor Ansprüchen Dritter aufgrund von Vermögensschäden, die durch fehlerhafte Beratung, Verwaltungsfehler oder Pflichtverletzungen entstehen. Besonders für Hausverwaltungen und Wohnungsgenossenschaften ist dieser Schutz unverzichtbar."
    - question: "Was unterscheidet ASW südwest von allgemeinen Versicherungsmaklern?"
      answer: "Wir sind ausschließlich auf die Wohnungswirtschaft spezialisiert. Das bedeutet: branchenspezifische Rahmenverträge, tiefes Verständnis der regulatorischen Anforderungen, direkte Verbindungen zu den Verbänden (VdW, GdW) und ein Netzwerk aus spezialisierten Dienstleistern."
    - question: "Wie läuft eine Schadenmeldung ab?"
      answer: "Melden Sie Schäden direkt über unser Online-Formular oder telefonisch. Unser Schadenmanagement-Team übernimmt die komplette Abwicklung: Dokumentation, Kommunikation mit dem Versicherer, Koordination von Gutachtern und Begleitung bis zur Regulierung."
    - question: "Ist eine Cyberversicherung für Wohnungsunternehmen relevant?"
      answer: "Absolut. Wohnungsunternehmen verarbeiten große Mengen personenbezogener Daten und sind zunehmend Ziel von Cyberangriffen. Eine Cyberversicherung deckt Eigenschäden, Haftpflichtansprüche, IT-Forensik und DSGVO-Bußgelder ab."
    - question: "Für welche Unternehmen ist ASW südwest der richtige Partner?"
      answer: "Wir betreuen Wohnungsunternehmen, Wohnungsgenossenschaften, kommunale Wohnungsgesellschaften, Hausverwaltungen und weitere Akteure der Wohnungswirtschaft -- vom kleinen Bestandshalter bis zum großen Landesentwickler."

