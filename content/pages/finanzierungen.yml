nt_immoconsult:
  tag: "NT ImmoConsult"
  title: "Eine solide Finanzierung als Basis"
  text: "Unser Schwesterunternehmen, die NT ImmoConsult, verfügt über langjährige Erfahrungen und weitreichende Branchenkenntnisse. Ihre Experten sind den vitalen Interessen unserer Kunden verpflichtet. Als ungebundener Dienstleister der Wohnungswirtschaft kann die NT ImmoConsult auf das gesamte Angebotsspektrum zugreifen und Ihr Finanzportfolio nachhaltig optimieren. In zentraler Funktion zwischen Wohnungsunternehmen und den verschiedenen Finanzinstituten sorgen wir zudem dafür, Ihren Aufwand im Finanzmanagement deutlich zu reduzieren."

dienstleistungen:
  cards:
    - title: "Darlehensprodukte"
      text: "Vermittlung verschiedener Darlehensprodukte: Kapitalmarktmittel, KfW-Darlehen, Modernisierungs- und Instandhaltungsdarlehen, kurzfristige Kredite und Unternehmensfinanzierungen."
    - title: "Umschuldungen & Forward"
      text: "Durchführung von Umschuldungen und Forward-Darlehen."
    - title: "Portfolio-Analyse"
      text: "Ermittlung von Beleihungswerten, Mobilisierung von Finanzierungsreserven, Analyse von Darlehensportfolios und Zinsrisiken."
    - title: "Festgeldanlagen"
      text: "Vermittlung von Festgeldanlagen. Die richtige Finanzierungsentscheidung ist maßgeblich für die Wirtschaftlichkeit Ihrer Maßnahmen."
  cta_text: "Hier geht's zur NT ImmoConsult"

