geschichte:
  tag: "Unsere Geschichte"
  title: "Von der Gründung zum führenden Branchenmakler"
  text_1: "ASW südwest wurde 1999 in Frankfurt am Main gegründet -- mit einer klaren Mission: Wohnungsunternehmen, Genossenschaften und Hausverwaltungen mit branchenspezifischen Versicherungslösungen optimal abzusichern."
  text_2: "Was als kleines Maklerbüro begann, ist heute ein Team aus 10 erfahrenen Branchenexperten, das über 3.000 GdW-Mitgliedsunternehmen bundesweit betreut. Unsere enge Zusammenarbeit mit dem VdW südwest und dem GdW ermöglicht exklusive Rahmenverträge, die allgemeine Makler nicht bieten können."
  timeline:
    - year: "1999"
      title: "Gründung"
      text: "Gründung als spezialisierter Versicherungsmakler für die Wohnungswirtschaft in Südwestdeutschland."
    - year: "2005"
      title: "VdW-Partnerschaft"
      text: "Offizieller Versicherungspartner des VdW südwest. Beginn der exklusiven Rahmenverträge für Mitgliedsunternehmen."
    - year: "2015"
      title: "Bundesweite Betreuung"
      text: "Ausbau auf bundesweite Betreuung von GdW-Mitgliedsunternehmen. Aufbau des Schadenmanagement-Teams."
    - year: "Heute"
      title: "Marktführer"
      text: "10 Branchenexperten betreuen über 3.000 Mitgliedsunternehmen mit maßgeschneiderten Versicherungslösungen."

