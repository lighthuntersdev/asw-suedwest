werte:
  tag: "Unsere Werte"
  title: "Wofür wir stehen"
  subtitle: "Vier Grundsätze prägen unsere Arbeit -- jeden Tag, bei jedem Kunden, in jeder Beratung."
  items:
    - title: "Spezialisierung"
      text: "100 % Fokus auf die Wohnungswirtschaft. Keine Ablenkung durch andere Branchen -- unser gesamtes Wissen, unsere Kontakte und unsere Rahmenverträge gelten ausschließlich dieser Branche."
    - title: "Transparenz"
      text: "Offene Kommunikation, nachvollziehbare Empfehlungen und ehrliche Beratung. Wir zeigen Ihnen alle Optionen -- mit Vor- und Nachteilen -- damit Sie fundiert entscheiden können."
    - title: "Persönlicher Service"
      text: "Feste Ansprechpartner, die Ihr Unternehmen und Ihre Bedürfnisse kennen. Keine Callcenter, keine anonymen Ticketsysteme -- persönliche Betreuung auf Augenhöhe."
    - title: "Branchennetzwerk"
      text: "Tiefe Verwurzelung in der Wohnungswirtschaft durch Partnerschaften mit VdW südwest, GdW, TDW und weiteren Verbänden. Dieses Netzwerk sichert Ihnen exklusive Konditionen."

partnerschaften:
  tag: "Partnerschaften"
  title: "Starke Verbindungen in der Branche"
  subtitle: "Unsere Partnerschaften ermöglichen exklusive Rahmenverträge und erstklassige Konditionen für die Wohnungswirtschaft."
  items:
    - name: "VdW südwest"
      text: "Verband der Südwestdeutschen Wohnungswirtschaft. Als offizieller Versicherungspartner betreuen wir die Mitgliedsunternehmen in Hessen, Rheinland-Pfalz und dem Saarland mit exklusiven Rahmenverträgen."
    - name: "GdW Bundesverband"
      text: "Bundesverband deutscher Wohnungs- und Immobilienunternehmen. Über den GdW erreichen wir mehr als 3.000 Mitgliedsunternehmen bundesweit und verhandeln branchenführende Konditionen."
    - name: "TDW südwest"
      text: "Treuhandstelle der Wohnungswirtschaft. Enge Zusammenarbeit bei Prüfung und Beratung von Wohnungsunternehmen, insbesondere bei Risikobewertung und Compliance."
    - name: "AWTS"
      text: "Arbeitsgemeinschaft Wohnungswirtschaftliche Treuhandstellen. Gemeinsame Entwicklung von branchenspezifischen Versicherungskonzepten und Risikomanagement-Standards."
    - name: "NT Hannover"
      text: "Norddeutsche Treuhandstelle. Partnerschaft zur bundesweiten Ausweitung unserer Betreuungskapazität und zum Austausch bewährter Versicherungslösungen."

